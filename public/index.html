<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Task Generator</title>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: #f5f6fa;
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .container {
        width: 90%;
        max-width: 700px;
        background: #fff;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        margin-bottom: 1rem;
      }
      .input-area {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      textarea,
      select,
      button {
        padding: 0.75rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      button {
        background-color: #0078ff;
        color: #fff;
        border: none;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background-color: #005edc;
      }
      .tasks {
        margin-top: 2rem;
      }
      .task {
        background: #eef3ff;
        padding: 1rem;
        border-radius: 10px;
        margin-bottom: 1rem;
      }
      .task h3 {
        margin: 0 0 0.5rem 0;
      }
      .task small {
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>AI Task Generator</h1>
      <div class="input-area">
        <textarea
          id="goal"
          rows="3"
          placeholder="What do you want to learn or achieve?"
        ></textarea>
        <select id="model">
          <option value="mistral">Mistral</option>
          <option value="gpt-4o">GPT-4o</option>
          <option value="gemma3:12b">Gemma3</option>
          <option value="deepseek-r1:8b">Deepseek-R1</option>
        </select>
        <button id="generateBtn">Generate Tasks</button>
      </div>
      <div class="tasks" id="tasks"></div>
    </div>

    <script>
      const btn = document.getElementById("generateBtn");
      const tasksDiv = document.getElementById("tasks");

      btn.addEventListener("click", async () => {
        const goal = document.getElementById("goal").value.trim();
        const model = document.getElementById("model").value;
        if (!goal) return alert("Please enter your goal");

        tasksDiv.innerHTML = "<p>Generating tasks...</p>";

        // Example local API call to your Node.js + Ollama backend
        try {
          const response = await fetch("http://localhost:3000/generate-tasks", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic: goal, model }),
          });
          const data = await response.json();

          tasksDiv.innerHTML = "";
          data.tasks.forEach((task) => {
            const el = document.createElement("div");
            el.className = "task";
            el.innerHTML = `
            <h3>${task.title}</h3>
            <p>${task.description}</p>
          `;
            tasksDiv.appendChild(el);
          });
        } catch (err) {
          tasksDiv.innerHTML =
            '<p style="color:red">Error generating tasks.</p>';
          console.error(err);
        }
      });
    </script>
  </body>
</html>
